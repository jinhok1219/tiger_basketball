<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>젠랑이 농구! 🐯🏀</title>
    <meta property="og:title" content="젠랑이 농구! 🐯🏀">
    <meta property="og:description" content="신기록에 도전하세요! 🏀">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
            touch-action: none; 
            position: relative; 
        }
        canvas {
            background-color: #f5f6fa; 
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            border-radius: 10px;
            cursor: pointer;
            
            /* 🔥 수정한 부분 1: 폰 화면 잘림 방지 (화면 크기에 딱 맞게 자동 조절) */
            max-width: 100vw; 
            max-height: 100vh;
            object-fit: contain; 
        }
        /* 🔥 멋진 재시작 버튼 스타일 🔥 */
        #restartBtn {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 24px;
            font-family: 'Malgun Gothic', sans-serif;
            font-weight: bold;
            color: white;
            background-color: #e74c3c;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
            transition: all 0.2s;
            display: none; 
            z-index: 10;
        }
        #restartBtn:hover {
            background-color: #c0392b;
            transform: translate(-50%, -50%) scale(1.05);
        }
        #restartBtn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="500" height="700"></canvas>
<button id="restartBtn">다시 하기 🔄</button>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restartBtn");

    const tigerImg = new Image();
    tigerImg.src = "image_d40d0f.png";

    // --- 3D 투영 및 물리 환경 세팅 ---
    const FOV = 400;         
    const GRAVITY = 1.3;     
    const BALL_RADIUS = 40;  

    function project3D(x, y, z) {
        const scale = FOV / (FOV + Math.max(z, -FOV + 1));
        const screenX = canvas.width / 2 + x * scale;
        const screenY = y * scale; 
        return { x: screenX, y: screenY, scale: scale };
    }

    let score = 0;
    let timeLeft = 60;
    let isGameOver = false;
    let startTime = Date.now();

    // 🔥 수정한 부분 16: 이펙트(별가루, 파동)를 저장할 배열 추가!
    let effects = [];

    const court = {
        backboardZ: 250, 
        baseBackboardY: 150, 
        backboardW: 260,
        backboardH: 220,
        hoopZ: 200,      
        baseHoopY: 250,      
        hoopRadius: 70,  
        
        backboardY: 150,     
        hoopY: 250,          
        
        offsetX: 0,
        offsetY: 0,          
        
        moveSpeedX: 1.5,     
        moveSpeedY: 2,       
        directionX: 1,       
        directionY: 1,       

        update(time) {
            if (time <= 40 && time > 20) {
                this.offsetX += this.moveSpeedX * this.directionX;
                if (this.offsetX > 200 || this.offsetX < -200) { 
                    this.directionX *= -1;
                }
                this.offsetY = 0; 
            }
            else if (time <= 20) {
                this.offsetX += this.moveSpeedX * this.directionX;
                this.offsetY += this.moveSpeedY * this.directionY;

                if (this.offsetX > 200 || this.offsetX < -200 || Math.random() < 0.02) {
                    this.directionX = this.offsetX > 0 ? -1 : 1;
                    this.moveSpeedX = Math.random() * 3 + 1.5; 
                }
                if (this.offsetY > 40 || this.offsetY < -100 || Math.random() < 0.02) {
                    this.directionY = this.offsetY > 0 ? -1 : 1;
                    this.moveSpeedY = Math.random() * 3 + 1.5; 
                }
            }

            this.backboardY = this.baseBackboardY + this.offsetY;
            this.hoopY = this.baseHoopY + this.offsetY;
        },

        drawBackboard() {
            const center = project3D(this.offsetX, this.backboardY, this.backboardZ);
            const w = this.backboardW * center.scale;
            const h = this.backboardH * center.scale;

            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#dcdde1";
            ctx.lineWidth = 4 * center.scale;
            ctx.beginPath();
            ctx.roundRect(center.x - w/2, center.y - h/2, w, h, 10);
            ctx.fill();
            ctx.stroke();

            const targetW = 100 * center.scale;
            const targetH = 80 * center.scale;
            const targetY = project3D(this.offsetX, this.hoopY - 40, this.backboardZ).y;
            
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 5 * center.scale;
            ctx.strokeRect(center.x - targetW/2, targetY - targetH, targetW, targetH);
        },

        drawRimBack() {
            const center = project3D(this.offsetX, this.hoopY, this.hoopZ);
            const r = this.hoopRadius * center.scale;
            
            ctx.beginPath();
            ctx.ellipse(center.x, center.y, r, r * 0.3, 0, Math.PI, 0);
            ctx.strokeStyle = "#e67e22";
            ctx.lineWidth = 8 * center.scale;
            ctx.stroke();
        },

        drawRimFront() {
            const center = project3D(this.offsetX, this.hoopY, this.hoopZ);
            const r = this.hoopRadius * center.scale;
            
            ctx.beginPath();
            ctx.ellipse(center.x, center.y, r, r * 0.3, 0, 0, Math.PI);
            ctx.strokeStyle = "#e67e22";
            ctx.lineWidth = 8 * center.scale;
            ctx.lineCap = "round";
            ctx.stroke();
        }
    };

    const rimPoints = [];
    for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12;
        rimPoints.push({
            offsetX: Math.cos(angle) * court.hoopRadius,
            offsetZ: Math.sin(angle) * court.hoopRadius
        });
    }

    let activeBalls = [];
    let isDragging = false;
    let startX = 0, startY = 0;

    function getPos(e) {
        if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    }

    function startDrag(e) {
        if (isGameOver) return;
        isDragging = true;
        const pos = getPos(e);
        startX = pos.x;
        startY = pos.y;
    }

    function endDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        const pos = getPos(e);
        const dx = pos.x - startX;
        const dy = pos.y - startY;

        if (dy < -20) {
            shootBall(dx, dy);
        }
    }

    canvas.addEventListener('mousedown', startDrag);
    canvas.addEventListener('touchstart', startDrag, {passive: false});
    canvas.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchend', endDrag);

    restartBtn.addEventListener('click', () => {
        score = 0;
        timeLeft = 60;
        isGameOver = false;
        startTime = Date.now();
        activeBalls = [];
        effects = []; // 재시작 시 이펙트 초기화
        
        court.offsetX = 0;
        court.offsetY = 0;
        court.directionX = 1;
        court.directionY = 1;
        court.moveSpeedX = 1.5;
        court.moveSpeedY = 2;
        
        restartBtn.style.display = "none"; 
    });

    function shootBall(dx, dy) {
        let powerY = dy * 0.15; 
        if (powerY < -55) powerY = -55; 
        let powerZ = Math.abs(dy) * 0.015; 
        if (powerZ > 13) powerZ = 13; 

        activeBalls.push({
            x: 0,
            y: 600, 
            z: 0,
            vx: dx * 0.08,
            vy: powerY,
            vz: powerZ,
            radius: BALL_RADIUS,
            scored: false,
            oldY: 600,
            rotation: 0, 
            angularVelocity: (Math.random() - 0.5) * 0.8 
        });
    }

    function updatePhysics() {
        court.update(timeLeft);

        // 🔥 수정한 부분 17: 이펙트(별가루, 파동) 물리 로직 업데이트
        for (let i = effects.length - 1; i >= 0; i--) {
            let e = effects[i];
            if (e.type === 'star') {
                e.x += e.vx;
                e.y += e.vy;
                e.z += e.vz;
                e.vy += 0.5; // 별가루 중력
                e.rot += e.vRot; // 빙글빙글
                e.life -= 0.02;  // 서서히 사라짐
            } else if (e.type === 'hit') {
                e.size += 3;     // 파동 커짐
                e.life -= 0.05;  // 서서히 사라짐
            }
            if (e.life <= 0) effects.splice(i, 1);
        }

        const currentRimPoints = rimPoints.map(p => ({
            x: court.offsetX + p.offsetX,
            y: court.hoopY, 
            z: court.hoopZ + p.offsetZ
        }));

        for (let i = activeBalls.length - 1; i >= 0; i--) {
            let b = activeBalls[i];
            
            b.oldY = b.y;
            b.vy += GRAVITY; 
            
            b.x += b.vx;
            b.y += b.vy;
            b.z += b.vz;

            b.rotation += b.angularVelocity;

            if (b.y < -500) {
                b.y = -500;
                b.vy *= -0.6; 
                b.vx *= 0.8;
            }

            // 1. 림 충돌 
            for (let rp of currentRimPoints) {
                if (b.vy < 0 && b.y > court.hoopY + 10) continue; 

                const dist = Math.hypot(b.x - rp.x, b.y - rp.y, b.z - rp.z);
                if (dist < b.radius) {
                    const nx = (b.x - rp.x) / dist;
                    const ny = (b.y - rp.y) / dist;
                    const nz = (b.z - rp.z) / dist;
                    
                    const dot = b.vx * nx + b.vy * ny + b.vz * nz;
                    if (dot < 0) {
                        b.vx = (b.vx - 2 * dot * nx) * 0.7;
                        b.vy = (b.vy - 2 * dot * ny) * 0.7;
                        b.vz = (b.vz - 2 * dot * nz) * 0.7;
                        
                        const overlap = b.radius - dist;
                        b.x += nx * overlap;
                        b.y += ny * overlap;
                        b.z += nz * overlap;
                    }
                }
            }

            // 2. 백보드 충돌 (빨간 네모 스윗스팟 분리 + 타격 이펙트는 무조건 터짐!)
            if (b.vz > 0 && 
                b.z >= court.backboardZ - b.radius && 
                b.z <= court.backboardZ + b.radius) { 
                
                let backboardTopY = court.backboardY - court.backboardH/2;
                let hitMargin = 40; 
                
                if (b.x > court.offsetX - court.backboardW/2 - hitMargin && 
                    b.x < court.offsetX + court.backboardW/2 + hitMargin &&
                    b.y > backboardTopY - hitMargin &&  
                    b.y < court.backboardY + court.backboardH/2 + hitMargin) {
                    
                    b.z = court.backboardZ - b.radius; 

                    // 🔥 수정한 부분 23: 백보드 어디를 맞추든 무조건 노란 파동 이펙트는 터짐!
                    effects.push({ type: 'hit', x: b.x, y: b.y, z: court.backboardZ, life: 1.0, size: 10 }); 

                    // 빨간 네모(스윗스팟) 범위 계산
                    let targetW = 100;
                    let targetH = 80;
                    let targetTopY = court.hoopY - 40 - targetH;
                    let targetBottomY = court.hoopY - 40;

                    let hitSweetSpot = (
                        b.x > court.offsetX - targetW/2 && 
                        b.x < court.offsetX + targetW/2 &&
                        b.y > targetTopY &&  
                        b.y < targetBottomY
                    );

                    if (hitSweetSpot) {
                        // 🌟 [빨간 네모 명중!] 찰지게 골대 안으로 튕겨줌
                        b.vz *= -0.4; 
                        b.vx *= 0.4; 
                        b.vy *= 0.6;
                    } else {
                        // 💦 [그냥 하얀 판 맞음] 스윗스팟 빗나감! 엉뚱하게 튕겨나감
                        b.vz *= -0.7; // 더 튕겨나옴
                        b.vx *= 0.9;  // 옆으로 날아감
                        b.vy *= 0.9;
                    }
                }
            }

            // 3. 득점 판정
            if (b.vy > 0 && b.oldY < court.hoopY && b.y >= court.hoopY) {
                const distFromCenter = Math.hypot(b.x - court.offsetX, b.z - court.hoopZ);
                if (distFromCenter < 30) { 
                    if (!b.scored) {
                        score++;
                        b.scored = true;
                        b.vx *= 0.4;
                        b.vy *= 0.5;
                        b.vz *= 0.4;

                        // 🔥 수정한 부분 19: 골인 시 림 주변에서 황금 별가루 10개 팡! 터짐
                        for (let k = 0; k < 12; k++) {
                            effects.push({
                                type: 'star',
                                x: court.offsetX, y: court.hoopY, z: court.hoopZ,
                                vx: (Math.random() - 0.5) * 16,
                                vy: (Math.random() - 1) * 15,
                                vz: (Math.random() - 0.5) * 10,
                                life: 1.0,
                                rot: Math.random() * Math.PI * 2,
                                vRot: (Math.random() - 0.5) * 0.5
                            });
                        }
                    }
                }
            }

            if (b.y > 1200) activeBalls.splice(i, 1);
        }

        // 공끼리 부딪히는 물리 엔진 로직 
        for (let i = 0; i < activeBalls.length; i++) {
            for (let j = i + 1; j < activeBalls.length; j++) {
                let b1 = activeBalls[i];
                let b2 = activeBalls[j];

                let dx = b2.x - b1.x;
                let dy = b2.y - b1.y;
                let dz = b2.z - b1.z;
                
                let dist = Math.hypot(dx, dy, dz);
                let minDist = b1.radius + b2.radius;

                if (dist < minDist && dist > 0) {
                    let overlap = minDist - dist;
                    let nx = dx / dist;
                    let ny = dy / dist;
                    let nz = dz / dist;

                    b1.x -= nx * (overlap / 2);
                    b1.y -= ny * (overlap / 2);
                    b1.z -= nz * (overlap / 2);
                    b2.x += nx * (overlap / 2);
                    b2.y += ny * (overlap / 2);
                    b2.z += nz * (overlap / 2);

                    let rvx = b2.vx - b1.vx;
                    let rvy = b2.vy - b1.vy;
                    let rvz = b2.vz - b1.vz;

                    let velAlongNormal = rvx * nx + rvy * ny + rvz * nz;
                    
                    if (velAlongNormal > 0) continue; 

                    let restitution = 0.7; 
                    let impulse = -(1 + restitution) * velAlongNormal / 2;

                    b1.vx -= impulse * nx;
                    b1.vy -= impulse * ny;
                    b1.vz -= impulse * nz;
                    b2.vx += impulse * nx;
                    b2.vy += impulse * ny;
                    b2.vz += impulse * nz;
                }
            }
        }
    }

    function drawBall(b) {
        const proj = project3D(b.x, b.y, b.z);
        const r = b.radius * proj.scale;
        
        if (tigerImg.complete) {
            ctx.save(); 
            ctx.translate(proj.x, proj.y);
            ctx.rotate(b.rotation);
            ctx.drawImage(tigerImg, -r, -r, r * 2, r * 2);
            ctx.restore(); 

            const gradient = ctx.createRadialGradient(
                proj.x - r * 0.3, proj.y - r * 0.3, r * 0.1,  
                proj.x, proj.y, r                             
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.4)'); 
            gradient.addColorStop(0.5, 'rgba(0, 0, 0, 0)');       
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.6)');       
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(proj.x, proj.y, r, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!isGameOver) {
            timeLeft = Math.max(0, 60 - Math.floor((Date.now() - startTime) / 1000));
            if (timeLeft <= 0) {
                isGameOver = true;
                restartBtn.style.display = "block"; 
            }
        }

        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.font = "bold 250px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(score, canvas.width/2, canvas.height/2 + 50);
        ctx.textBaseline = "alphabetic";

        activeBalls.sort((a, b) => b.z - a.z); 

        // 1. 백보드 뒤의 공
        activeBalls.forEach(b => { if (b.z > court.backboardZ) drawBall(b); });

        // 2. 백보드 및 뒷 림
        court.drawBackboard();
        
        // 🔥 수정한 부분 20: 백보드 맞을 때 생기는 하얀 파동 그리기 (백보드 바로 위에 그림)
        effects.forEach(e => {
            if (e.type === 'hit') {
                const proj = project3D(e.x, e.y, e.z);
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, e.size * proj.scale, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 215, 0, ${e.life})`;
                ctx.lineWidth = 6 * proj.scale;
                ctx.stroke();
            }
        });

        court.drawRimBack();

        // 3. 백보드와 림 사이의 공
        activeBalls.forEach(b => { if (b.z <= court.backboardZ && b.z > court.hoopZ) drawBall(b); });

        // 4. 앞 림
        court.drawRimFront();

        // 🔥 수정한 부분 21: 골인 시 생기는 황금 별가루 그리기 (림 앞쪽에 그림)
        effects.forEach(e => {
            if (e.type === 'star') {
                const proj = project3D(e.x, e.y, e.z);
                let r = 15 * proj.scale * e.life; // 사라지면서 점점 작아짐
                ctx.save();
                ctx.translate(proj.x, proj.y);
                ctx.rotate(e.rot);
                ctx.globalAlpha = e.life;
                ctx.beginPath();
                for (let j = 0; j < 5; j++) {
                    ctx.lineTo(Math.cos((18 + j * 72) * Math.PI / 180) * r,
                               -Math.sin((18 + j * 72) * Math.PI / 180) * r);
                    ctx.lineTo(Math.cos((54 + j * 72) * Math.PI / 180) * r * 0.5,
                               -Math.sin((54 + j * 72) * Math.PI / 180) * r * 0.5);
                }
                ctx.closePath();
                ctx.fillStyle = "#f1c40f"; // 황금색
                ctx.fill();
                ctx.restore();
            }
        });

        // 5. 림보다 앞쪽의 공
        activeBalls.forEach(b => { if (b.z <= court.hoopZ) drawBall(b); });

        if (!isGameOver) {
            const readyProj = project3D(0, 560, 0);
            const r = BALL_RADIUS * readyProj.scale;
            
            if (isDragging) ctx.globalAlpha = 0.4;
            
            if (tigerImg.complete) {
                ctx.save();
                ctx.translate(readyProj.x, readyProj.y);
                ctx.drawImage(tigerImg, -r, -r, r * 2, r * 2);
                ctx.restore();

                const gradient = ctx.createRadialGradient(
                    readyProj.x - r * 0.3, readyProj.y - r * 0.3, r * 0.1,  
                    readyProj.x, readyProj.y, r                             
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.4)'); 
                gradient.addColorStop(0.5, 'rgba(0, 0, 0, 0)');       
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0.6)');       
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(readyProj.x, readyProj.y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.globalAlpha = 1.0;
        }

        ctx.fillStyle = "#2c3e50";
        ctx.font = "bold 20px 'Malgun Gothic'";
        ctx.textAlign = "left";
        ctx.fillText(`남은 시간: ${timeLeft}초`, 20, 35);
        
        if (timeLeft <= 40 && timeLeft > 20 && !isGameOver) {
            ctx.fillStyle = "#e74c3c"; 
            ctx.textAlign = "right";
            ctx.fillText(`🔥 무빙 시작!`, canvas.width - 20, 35);
        } else if (timeLeft <= 20 && !isGameOver) {
            ctx.fillStyle = "#8e44ad"; 
            ctx.textAlign = "right";
            ctx.fillText(`👿 광란 모드!`, canvas.width - 20, 35);
        }

        if (isGameOver) {
            ctx.fillStyle = "rgba(44, 62, 80, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.font = "bold 50px 'Malgun Gothic'";
            ctx.fillText(`시간 종료!`, canvas.width/2, canvas.height/2 - 60);
            ctx.fillStyle = "#f1c40f";
            ctx.font = "bold 35px 'Malgun Gothic'";
            ctx.fillText(`최종 점수: ${score}점`, canvas.width/2, canvas.height/2 + 10);
        }
    }

    function gameLoop() {
        if (!isGameOver) updatePhysics();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>

</body>
</html>
